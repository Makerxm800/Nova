name: Build Nova Search installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            command: npm run dist:win
          - platform: macOS
            os: macos-latest
            command: npm run dist:mac -- --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The notes file lives in the repo, so it has to be checked out or
      # body_path silently resolves to nothing and the release body ships empty.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          name: Nova Search 2.0.0 Beta 2
          body_path: docs/release-notes.md
          prerelease: true
          files: release-assets/*
