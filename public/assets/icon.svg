<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nova Search">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14122a"/>
      <stop offset="0.55" stop-color="#0b0b16"/>
      <stop offset="1" stop-color="#080910"/>
    </linearGradient>
    <linearGradient id="spark" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.42" stop-color="#8b5cf6"/>
      <stop offset="0.78" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.52">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <circle cx="256" cy="244" r="176" fill="url(#halo)"/>
  <circle cx="256" cy="244" r="132" fill="none" stroke="#a78bfa" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="256" cy="244" r="168" fill="none" stroke="#67e8f9" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- orbit sweep -->
  <path d="M96 300c38 58 106 92 176 86 62-5 116-38 146-86" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

  <!-- nova spark -->
  <g filter="url(#soft)" opacity="0.75">
    <path d="M256 92 288 214 408 248 288 282 256 404 224 282 104 248 224 214Z" fill="#8b5cf6"/>
  </g>
  <path d="M256 84 287 212 412 246 287 280 256 408 225 280 100 246 225 212Z" fill="url(#spark)"/>
  <path d="M256 128 274 210 256 246 238 210Z" fill="#ffffff" opacity="0.62"/>
  <path d="M256 366 268 300 256 280 244 300Z" fill="#ffffff" opacity="0.22"/>
  <circle cx="392" cy="128" r="9" fill="#67e8f9"/>
  <circle cx="118" cy="158" r="6" fill="#f472b6" opacity="0.9"/>
  <circle cx="150" cy="380" r="4.5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="368" cy="388" r="5" fill="#22d3ee" opacity="0.55"/>
</svg>
